name: CI/CD Deploy to VPS

on:
  workflow_run:
    workflows: ["Run Backend Tests"] # имя из test.yml
    types:
      - completed

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on VPS..."

            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              apt update && apt install -y docker.io
            fi

            if ! docker compose version &> /dev/null; then
              echo "🧩 Installing Docker Compose plugin..."
              apt update && apt install -y docker-compose-plugin
            fi

            echo "🗑️ Cleaning up old deployment..."
            rm -rf ~/zstore

            echo "📦 Cloning fresh repository..."
            git clone --depth 1 https://github.com/${{ github.repository }} ~/zstore

            cd ~/zstore

            echo "🔧 Creating .env file..."
            JWT_SECRET=$(openssl rand -base64 32)
            cat > .env << EOF
            JWT_SECRET=$JWT_SECRET
            PG_HOST=127.0.0.1
            PG_USER=kyte
            PG_PASSWORD=utjhubq12345
            PG_DB=zstore
            PG_PORT=5432
            PORT=5000
            NODE_ENV=production
            EOF

            cp .env server/app/.env

            echo "🧱 Stopping old containers..."
            docker compose down -v || true

            echo "🏗️ Building and starting new containers..."
            docker compose up -d --build

            echo "✅ Deployment completed successfully!"

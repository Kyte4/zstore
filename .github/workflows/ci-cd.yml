name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kyte
          POSTGRES_PASSWORD: utjhubq12345
          POSTGRES_DB: zstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyte -d zstore -f dump.sql"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
      PG_DB: ${{ secrets.PG_DB }}
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and run tests
        run: |
          cd server/app
          npm ci
          npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "🚀 Starting deployment on VPS..."

            # Клонировать проект, если он ещё не существует
            if [ ! -d "~/zstore" ]; then
              git clone https://github.com/${{ github.repository }} ~/zstore
            fi

            cd ~/zstore

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "🧱 Building Docker containers..."
            docker-compose down
            docker-compose up -d --build

            echo "✅ Deployment completed successfully!"

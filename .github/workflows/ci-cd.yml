name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kyte
          POSTGRES_PASSWORD: utjhubq12345
          POSTGRES_DB: zstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: localhost
      PG_PORT: 5432
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        env:
          PGPASSWORD: utjhubq12345
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U kyte -d zstore; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... Attempt $i"
            sleep 2
          done

      - name: Create database tables from dump
        env:
          PGPASSWORD: utjhubq12345
        run: |
          psql -h localhost -U kyte -d zstore -f dump.sql

      - name: Install dependencies and run tests
        run: |
          cd server/app
          npm ci
          npm test

  deploy:
  runs-on: ubuntu-latest
  needs: test
  if: github.ref == 'refs/heads/main'

  steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script_stop: true
        script: |
          set -e
          echo "🚀 Starting deployment on VPS..."
          
          # Переходим в директорию или клонируем если не существует
          if [ ! -d "~/zstore" ]; then
            echo "📦 Cloning repository for the first time..."
            git clone https://github.com/${{ github.repository }} ~/zstore
            cd ~/zstore
          else
            echo "📦 Updating existing repository..."
            cd ~/zstore
            git fetch --all
            git reset --hard origin/main
            git pull origin main
          fi
          
          echo "🧱 Building Docker containers..."
          docker-compose down
          docker-compose up -d --build
          
          echo "✅ Deployment completed successfully!"
name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kyte
          POSTGRES_PASSWORD: utjhubq12345
          POSTGRES_DB: zstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: localhost
      PG_PORT: 5432
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        env:
          PGPASSWORD: utjhubq12345
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U kyte -d zstore; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... Attempt $i"
            sleep 2
          done

      - name: Load database schema from dump.sql
        env:
          PGPASSWORD: utjhubq12345
        run: |
          echo "🗃️ Loading database schema from dump.sql..."
          psql -h localhost -U kyte -d zstore -f dump.sql
          echo "✅ Database schema loaded successfully!"

      - name: Install dependencies and run tests
        run: |
          cd server/app
          npm ci
          npm test
        
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on VPS..."

            # Проверяем, что docker и compose установлены
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              apt update && apt install -y docker.io
            fi

            if ! docker compose version &> /dev/null; then
              echo "🧩 Installing Docker Compose plugin..."
              apt update && apt install -y docker-compose-plugin
            fi

            echo "🗑️ Cleaning up old deployment..."
            rm -rf ~/zstore

            echo "📦 Cloning fresh repository..."
            git config --global http.postBuffer 524288000
            git config --global http.version HTTP/1.1
            git clone --depth 1 https://github.com/${{ github.repository }} ~/zstore || {
              echo "❌ Git clone failed, retrying in 10s..."
              sleep 10
              git clone --depth 1 https://github.com/${{ github.repository }} ~/zstore
            }

            cd ~/zstore

            echo "🔧 Generating JWT_SECRET..."
            JWT_SECRET=$(openssl rand -base64 32)
            cat > .env << EOF
            JWT_SECRET=$JWT_SECRET
            PG_HOST=127.0.0.1
            PG_USER=kyte
            PG_PASSWORD=utjhubq12345
            PG_DB=zstore
            PG_PORT=5432
            PORT=5000
            NODE_ENV=production
            EOF

            cp .env server/app/.env

            echo "🧱 Stopping old containers (if any)..."
            docker compose down -v || true

            echo "🏗️ Building and starting containers..."
            docker compose up -d --build

            echo "⏳ Waiting for containers to start..."
            sleep 25

            echo "📊 Final containers status:"
            docker ps -a

            echo "✅ Deployment completed successfully!"
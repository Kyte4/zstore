version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: kyte
      POSTGRES_PASSWORD: utjhubq12345
      POSTGRES_DB: zstore
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyte -d zstore"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: db
      PG_PORT: 5432
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  formatter:
    image: node:20
    working_dir: /workspace
    volumes:
      - ./server/app:/workspace/server/app
      - ./server/client:/workspace/server/client
    command: >
      sh -c "
      npm install -g prettier eslint prettier-eslint-cli &&
      echo '🔧 Formatting server code...' &&
      prettier --write 'server/app/**/*.{js,jsx,ts,tsx,json,md}' &&
      eslint --fix 'server/app/**/*.{js,jsx,ts,tsx}' || true &&
      echo '🎨 Formatting client code...' &&
      prettier --write 'server/client/**/*.{js,jsx,ts,tsx,json,md}' &&
      eslint --fix 'server/client/**/*.{js,jsx,ts,tsx}' || true &&
      echo '✅ Formatting complete!'
      "
    profiles: ["dev"]
    # профили позволяют не запускать этот сервис вместе с app
    # он запускается вручную командой:
    # docker-compose run --rm formatter
  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: db
      PG_PORT: 5432
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    command: npm test
    working_dir: /server/app
    volumes:
    - ./server/app:/server/app
    entrypoint: >
      sh -c "npm install --include=dev && npm test"

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: zstore_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot
      --email kek_888@mail.com --agree-tos --no-eff-email
      -d zstore.site -d www.zstore.site"

networks:
  zstore-network:
    driver: bridge


volumes:
  pgdata:

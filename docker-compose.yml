version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: kyte
      POSTGRES_PASSWORD: utjhubq12345
      POSTGRES_DB: zstore
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyte -d zstore"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zstore-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: db
      PG_PORT: 5432
      NODE_ENV: production
      SWAGGER_SERVER_URL: https://zstore.site

      # 💡 добавляем эти 3 строки
      VIRTUAL_HOST: zstore.site,www.zstore.site
      LETSENCRYPT_HOST: zstore.site,www.zstore.site
      LETSENCRYPT_EMAIL: kek_888@mail.com
    expose:
      - "5000" # nginx-proxy слушает только expose, не ports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zstore-network
      - proxy-tier

  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 💡 важно — чтобы nginx мог понимать HTTPS заголовки
      ENABLE_IPV6: "false"
      TRUST_DOWNSTREAM_PROXY: "true"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - proxy-tier

  acme-companion:
    image: nginxproxy/acme-companion:latest
    container_name: nginx-proxy-acme
    restart: always
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: kek_888@mail.com
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - proxy-tier

  formatter:
    image: node:20
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./server/app:/workspace/server/app
      - ./server/client:/workspace/server/client
    command: >
      sh -c "
      cd /workspace &&
      npm install -g prettier eslint prettier-eslint-cli eslint-config-prettier eslint-plugin-prettier &&
      cd server/app && npm install --include=dev || true &&
      cd ../client && npm install --include=dev || true &&
      cd /workspace &&
      echo '🔧 Formatting server code...' &&
      prettier --write 'server/app/**/*.{js,jsx,ts,tsx,json,md}' &&
      eslint --fix 'server/app/**/*.{js,mjs}' || true &&
      echo '🎨 Formatting client code...' &&
      prettier --write 'server/client/src/**/*.{js,jsx,ts,tsx,json,md}' &&
      eslint --fix 'server/client/src/**/*.{js,jsx,ts,tsx}' || true &&
      echo '✅ Formatting complete!'
      "
    profiles: ["dev"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: db
      PG_PORT: 5432
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    command: npm test
    working_dir: /app
    volumes:
      - ./server/app:/app
      - ./.eslintrc.json:/app/.eslintrc.json:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
    entrypoint: >
      sh -c "npm install --include=dev && npm test"

networks:
  zstore-network:
    driver: bridge
  proxy-tier:
    driver: bridge

volumes:
  pgdata:

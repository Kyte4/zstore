version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: zstore
      POSTGRES_USER: kyte
      POSTGRES_PASSWORD: utjhubq12345
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      PG_USER: kyte
      PG_PASSWORD: utjhubq12345
      PG_DB: zstore
      PG_HOST: db
      PG_PORT: 5432
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - db


volumes:
  pgdata:
